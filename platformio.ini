; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env:release]
platform = espressif32
board = esp32dev
monitor_speed = 115200
framework = arduino
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.13
    khuuxuanngoc/DHT kxn@^3.4.4
    adafruit/Adafruit Unified Sensor@^1.1.15
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D BUILD_TIME=$UNIX_TIME
build_type = release

[env:debug]
platform = espressif32
board = esp32dev
monitor_speed = 115200
framework = arduino
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.13
    khuuxuanngoc/DHT kxn@^3.4.4
    adafruit/Adafruit Unified Sensor@^1.1.15
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D BUILD_TIME=$UNIX_TIME
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup

; Native environment for unit tests (requires GCC/MinGW on Windows)
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I test/mocks
    -D UNIT_TEST
build_src_filter =
    +<*>
    +<**/*.cpp>
    -<.git/>
test_build_src = no
lib_deps =
lib_ignore =
    Adafruit SSD1306
    Adafruit GFX Library
    Adafruit BusIO
    DHT kxn
    Adafruit Unified Sensor

; Windows native test environment
[env:windows_x86]
platform = windows_x86
build_flags =
    -std=c++17
    -D UNIT_TEST
    -I test/mocks
test_framework = unity
test_build_src = yes
build_src_filter =
    +<Utils/Timer.cpp>
    +<Screen/Menu/Menu.cpp>
    +<Screen/Menu/MenuItem.cpp>
    +<Common/EnumClasses.h>
    -<main.cpp>
    -<Common/Data.cpp>
    -<Screen/Screen.cpp>
    -<Sensors/>
    -<ControlDevices/>
    -<Screen/Display/>
lib_deps =
